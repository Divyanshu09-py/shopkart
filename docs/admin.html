<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopKart - Admin Panel</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        ShopKart Admin
    </div>

    <nav>
        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="profile.html">
            My Profile
        </a>

        <a href="#" id="logoutLink">
            Logout
        </a>
    </nav>

</header>


<main class="admin-page">

    <h1>
        Admin Dashboard
    </h1>

    <p class="admin-welcome">
        Welcome to the ShopKart Admin Panel
    </p>


    <div class="admin-cards">

        <div class="admin-card">

            <h2>
                Products
            </h2>

            <p>
                Manage ShopKart products.
            </p>

            <button id="manageProductsBtn">
                Manage Products
            </button>

        </div>


        <div class="admin-card">

            <h2>
                Orders
            </h2>

            <p>
                View and manage customer orders.
            </p>

            <button id="manageOrdersBtn">
                Manage Orders
            </button>

        </div>


        <div class="admin-card">

            <h2>
                Users
            </h2>

            <p>
                View registered users.
            </p>

            <button id="manageUsersBtn">
                Manage Users
            </button>

        </div>

    </div>

</main>


<script src="js/admin.js"></script>

</body>

</html>
